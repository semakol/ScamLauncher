name: Release

# Выпуск: git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: create
        name: Черновик релиза
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="ScamLauncher ${GITHUB_REF_NAME#v}" \
            -F draft=true \
            -F generate_release_notes=true \
            --jq .id)
          if [ -z "$id" ]; then
            echo "::error::Не удалось создать черновик релиза"
            exit 1
          fi
          echo "Черновик релиза: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build-launcher:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Системные зависимости Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Версия из тега
        shell: bash
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - working-directory: app
        run: npm ci

      - name: Проверка номера релиза
        shell: bash
        run: |
          if [ -z "${{ needs.create-release.outputs.release_id }}" ]; then
            echo "::error::Пустой release_id — лаунчер некуда загружать"
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}
          updaterJsonPreferNsis: true

  build-scam-pack:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: scam-pack-${{ matrix.target }}

      - name: Версия из тега
        shell: bash
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Сборка
        run: cargo build --release -p scam-pack --target ${{ matrix.target }}

      - name: Загрузка в релиз
        shell: bash
        run: |
          ext=""
          [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          out="scam-pack-${{ matrix.target }}$ext"
          cp "target/${{ matrix.target }}/release/scam-pack$ext" "$out"
          gh release upload "$GITHUB_REF_NAME" "$out" --clobber -R "$GITHUB_REPOSITORY"

  publish-release:
    needs: [create-release, build-launcher, build-scam-pack]
    runs-on: ubuntu-latest
    steps:
      - name: Проверка файлов релиза
        run: |
          names=$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$names"
          missing=0
          need() {
            if ! echo "$names" | grep -Eq "$1"; then
              echo "::error::В релизе нет файла: $2"
              missing=1
            fi
          }
          need '^latest\.json$'                          'latest.json'
          need '_x64-setup\.exe$'                        'установщик Windows'
          need '_aarch64\.dmg$'                          'dmg для Mac (Apple Silicon)'
          need '_x64\.dmg$'                              'dmg для Mac (Intel)'
          need '\.AppImage$'                              'AppImage для Linux'
          need '^scam-pack-aarch64-apple-darwin$'         'scam-pack macOS arm64'
          need '^scam-pack-x86_64-apple-darwin$'          'scam-pack macOS x64'
          need '^scam-pack-x86_64-unknown-linux-gnu$'     'scam-pack Linux'
          need '^scam-pack-x86_64-pc-windows-msvc\.exe$'  'scam-pack Windows'
          [ "$missing" = 0 ] || exit 1

      - name: Проверка latest.json
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p latest.json -O latest.json
          cat latest.json
          jq -e --arg v "${GITHUB_REF_NAME#v}" '
            .version == $v and (.platforms as $pl
              | ["darwin-aarch64", "darwin-x86_64", "linux-x86_64", "windows-x86_64"]
              | all(($pl[.].signature // "") | length > 0))
          ' latest.json > /dev/null \
            || { echo "::error::latest.json неполный: нет платформы, подписи или версия не совпадает"; exit 1; }

      - name: Опубликовать релиз
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest -R "$GITHUB_REPOSITORY"
