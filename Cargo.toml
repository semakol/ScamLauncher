[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["semakol"]
repository = "https://github.com/semakol/ScamLauncher"

[workspace.dependencies]
scam-core = { path = "crates/scam-core" }
scam-mc = { path = "crates/scam-mc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.13", features = ["json", "query", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
sha1 = "0.11"
hex = "0.4"
globset = "0.4"
regex = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
toml = "1"
walkdir = "2"
indicatif = "0.18"
console = "0.16"
dirs = "7"
open = "5"
tempfile = "3"
self-replace = "1.5"
semver = "1"
sha2 = "0.11"
md-5 = "0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
